# The gate that catches two people editing the same rule from opposite ends.
#
# Two of us worked this branch on the same day from different machines: one
# turned the handover gates into walls, the other into advice, and neither
# found out until somebody read the diff by hand hours later. A red X on the
# push that caused it is worth more than any amount of care afterwards.
#
# API-only suites, no browser driver, so this stays under a minute. The
# browser suites still live in qa/regress.sh for the full gate.
name: checks

# Every push, on every branch — which already covers pull requests, because a
# check run attaches to the commit and a pull request shows the checks for its
# head commit. Listing `pull_request` as well fired both triggers for a branch
# with a PR open and ran the whole job twice over the same commit.
#
# A concurrency group cannot fix that on its own: for a push the group resolves
# to refs/heads/<branch> and for a pull_request to <branch>, so the two runs
# never share a group and neither cancels the other. Dropping the second
# trigger is what actually stops the duplicate. The group still earns its keep
# for successive pushes to the same branch — the only answer worth waiting for
# is the one about the newest commit.
#
# The trade: a pull request reopened with no new push does not re-run by
# itself, and this does not test the branch merged into main. Both are fine
# here — nobody works from a fork, and qa/regress.sh is the full gate.
on:
  push:
    branches: ['**']

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the client
        run: npm run build

      - name: Start the API on a scratch database
        env:
          DATA_DIR: ${{ runner.temp }}/data
          PORT: '4090'
        run: |
          mkdir -p "$DATA_DIR"
          node server/index.js > "${{ runner.temp }}/api.log" 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:4090/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:4090/api/health || { cat "${{ runner.temp }}/api.log"; exit 1; }

      # The suites that need a live server on :4090.
      - name: Pipeline suites
        env:
          DASHB_ROOT: ${{ github.workspace }}
        run: |
          node qa/deadlines-suite.mjs
          node qa/ownership-suite.mjs

      # These boot their own instances, so they need the checkout's path.
      - name: Storage and session suites
        env:
          DASHB_ROOT: ${{ github.workspace }}
        run: |
          node qa/round54-suite.mjs
          node qa/round57-suite.mjs
          node qa/round58-suite.mjs

      # The write path — the half that actually broke in production, when
      # GitHub's rate limiting was read as a dead credential and writes stopped.
      # These bring their own server and their own mock, so they only need the
      # checkout's path. They are the slow ones (outage survival means waiting
      # through real backoff), which is what takes this job from about one
      # minute to about three. Worth it: a regression here costs people's work.
      - name: Write-path suites
        env:
          DASHB_ROOT: ${{ github.workspace }}
        run: |
          node qa/round55-suite.mjs
          node qa/storage-suite.mjs

      # The GitHub storage driver, against a mock that answers like the real
      # API — including the 500s and the rate-limit replies. Each suite gets a
      # freshly restarted mock, the same way qa/regress.sh runs them.
      - name: Storage driver suites
        env:
          DASHB_ROOT: ${{ github.workspace }}
        run: |
          # `if ! node …` and not `node …; ok=$?`: these blocks run under
          # bash -e, where a failing command aborts the step immediately —
          # before the exit code is captured, so the mock would never be
          # stopped and its log never printed. The step would still go red,
          # but red with nothing to read is half a signal.
          for s in gh-suite gh500-suite; do
            MOCK_PORT=9977 node qa/mock-gh.mjs > "${{ runner.temp }}/mock-$s.log" 2>&1 &
            mock=$!
            for i in $(seq 1 20); do
              curl -s http://localhost:9977 >/dev/null 2>&1 && break
              sleep 0.5
            done
            ok=0
            if ! node "qa/$s.mjs"; then ok=1; fi
            kill $mock 2>/dev/null || true
            wait $mock 2>/dev/null || true
            if [ $ok -ne 0 ]; then
              echo "--- mock-gh log for $s ---"
              cat "${{ runner.temp }}/mock-$s.log" || true
              exit 1
            fi
          done

      # The Telegram bridge: these boot their own API and their own bot mock.
      - name: Notification suites
        env:
          DASHB_ROOT: ${{ github.workspace }}
        run: |
          node qa/round40-suite.mjs
          node qa/round41-suite.mjs
          node qa/round47-suite.mjs

      - name: Server log on failure
        if: failure()
        run: cat "${{ runner.temp }}/api.log" || true
