<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a32234" />
    <!-- Installable, so the team reaches the board by tapping an icon rather
         than remembering a .vercel.app address. iOS reads the apple- tags and
         ignores the manifest's display mode; everything else reads the
         manifest. -->
    <!-- The wordmark's face. Latin only is fine: it sets four words of brand
         text and nothing else — the UI keeps its own stack, which covers the
         Cyrillic this team writes in. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SATashkent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SATashkent" />
    <!-- Windows tiles read these rather than the manifest. -->
    <meta name="msapplication-TileColor" content="#a32234" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <title>SATashkent · Marketing Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
