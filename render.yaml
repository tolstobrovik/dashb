# Render Blueprint — deploys the whole dashboard as one web service.
# In Render:  New +  →  Blueprint  →  pick this repo  →  Apply.
services:
  - type: web
    name: satashkent
    runtime: node
    plan: free
    branch: main
    # --include=dev so Vite (a devDependency) is available to build the UI
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true      # Render generates a strong secret for you
      - key: NODE_VERSION
        value: "22"
      # The free plan has no persistent disk, so the SQLite file resets on
      # every deploy/restart. For durable data at $0, create a free Turso
      # database (see README "Deploy" section) and uncomment:
      # - key: TURSO_DATABASE_URL
      #   sync: false
      # - key: TURSO_AUTH_TOKEN
      #   sync: false
